<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tioFlight - Live Crash Arena</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-body: #080c14;
            --bg-card: #121927;
            --border-card: #1e293b;
            --primary-red: #f43f5e;
            --primary-green: #10b981;
            --primary-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Responsive Layout Container (Mobile & PC) */
        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0b111e;
        }

        @media (min-width: 900px) {
            .app-container {
                height: 94vh;
                border-radius: 20px;
                border: 1px solid var(--border-card);
                overflow: hidden;
                box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            }
        }

        /* Top Header */
        .header {
            padding: 12px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .header-brand i {
            color: var(--primary-red);
            font-size: 20px;
        }

        .user-balance-pill {
            background: rgba(16, 185, 129, 0.12);
            border: 1.5px solid var(--primary-green);
            color: var(--primary-green);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* History Chip Bar */
        .history-strip {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            background: #090e18;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-card);
            scrollbar-width: none;
        }
        .history-strip::-webkit-scrollbar { display: none; }

        .chip {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            background: var(--bg-card);
            color: #94a3b8;
        }
        .chip.blue { color: #38bdf8; }
        .chip.purple { color: #a855f7; }
        .chip.gold { color: #f59e0b; }

        /* Main Game Grid (Auto-splits on Desktop) */
        .main-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 900px) {
            .main-layout {
                flex-direction: row;
            }
        }

        /* Arena Stage (Canvas) */
        .stage-pane {
            flex: 1.4;
            position: relative;
            background: radial-gradient(circle at center, #162035 0%, #080d16 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 280px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .stage-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .stage-multiplier {
            font-size: clamp(48px, 8vw, 75px);
            font-weight: 900;
            letter-spacing: -1.5px;
            color: #ffffff;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
        }

        .stage-status {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .status-wait { color: var(--primary-gold); }
        .status-fly { color: var(--primary-green); }
        .status-crash { color: var(--primary-red); }

        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--primary-gold);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Controls Pane (Bottom on Mobile, Right on PC) */
        .controls-pane {
            flex: 1;
            background: var(--bg-card);
            border-top: 1px solid var(--border-card);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            z-index: 15;
            max-width: 100%;
        }

        @media (min-width: 900px) {
            .controls-pane {
                max-width: 420px;
                border-top: none;
                border-left: 1px solid var(--border-card);
            }
        }

        /* Bet Input Area */
        .bet-box-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bet-input-wrapper {
            flex: 1;
            position: relative;
        }

        .bet-input-wrapper span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 800;
            color: #64748b;
            font-size: 16px;
        }

        .bet-input-field {
            width: 100%;
            height: 48px;
            background: #090e18;
            border: 1.5px solid var(--border-card);
            border-radius: 12px;
            padding: 0 14px 0 32px;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            outline: none;
        }
        .bet-input-field:focus { border-color: var(--primary-red); }

        .quick-chips {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .chip-btn {
            background: #090e18;
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 8px 0;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .chip-btn:active { background: #1e293b; color: #fff; }

        /* THE ACTION BUTTON */
        .main-action-btn {
            width: 100%;
            height: 56px;
            border-radius: 14px;
            border: none;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
            transition: transform 0.1s ease, filter 0.15s ease;
        }
        .main-action-btn:active { transform: scale(0.98); }

        /* Button States */
        .btn-state-bet {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        }

        .btn-state-cancel {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.35);
        }

        .btn-state-cashout {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            animation: pulse-gold 1s infinite alternate;
        }

        .btn-state-disabled {
            background: #1e293b !important;
            color: #475569 !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
            animation: none !important;
        }

        @keyframes pulse-gold {
            from { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
            to { box-shadow: 0 0 25px rgba(245, 158, 11, 0.9); }
        }

        /* Real Bets List */
        .bets-container {
            flex: 1;
            min-height: 120px;
            background: #090e18;
            border: 1px solid var(--border-card);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .bets-header {
            padding: 8px 12px;
            background: #101624;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-card);
        }

        .bets-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
        }
        .bets-list::-webkit-scrollbar { width: 3px; }
        .bets-list::-webkit-scrollbar-thumb { background: #1e293b; }

        .bet-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 4px;
            border-bottom: 1px solid #131d2e;
            font-size: 12px;
            font-weight: 700;
        }
        .bet-entry .user-tag { color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
        .bet-entry .user-tag i { color: #64748b; font-size: 11px; }
        .bet-entry .win-tag { color: var(--primary-green); }

        .exit-link {
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Bar -->
    <div class="header">
        <div style="display: flex; align-items: center; gap: 14px;">
            <a href="index.html" class="exit-link"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="header-brand">
                <i class="fa-solid fa-jet-fighter-up"></i>
                <span>tioFlight</span>
            </div>
        </div>
        <div class="user-balance-pill">
            <i class="fa-solid fa-wallet"></i>
            <span id="txtUserBalance">৳ 0.00</span>
        </div>
    </div>

    <!-- History Chips -->
    <div class="history-strip" id="historyStrip">
        <span class="chip blue">1.34x</span>
        <span class="chip purple">3.12x</span>
        <span class="chip gold">18.40x</span>
        <span class="chip blue">1.08x</span>
        <span class="chip blue">1.95x</span>
    </div>

    <!-- Main Dual Layout -->
    <div class="main-layout">
        <!-- Stage / Canvas Area -->
        <div class="stage-pane" id="stagePane">
            <canvas id="flightCanvas"></canvas>
            
            <div class="stage-overlay">
                <div class="stage-multiplier" id="txtMultiplier">1.00x</div>
                <div class="stage-status status-wait" id="txtStatus">NEXT ROUND IN 5.0s</div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="fillCountdown"></div>
            </div>
        </div>

        <!-- Controls Area -->
        <div class="controls-pane">
            <div class="bet-box-row">
                <div class="bet-input-wrapper">
                    <span>৳</span>
                    <input type="number" class="bet-input-field" id="inputBetAmount" value="50" min="10" step="10">
                </div>
            </div>

            <!-- Quick Adjustments -->
            <div class="quick-chips">
                <div class="chip-btn" onclick="modifyStake('half')">1/2</div>
                <div class="chip-btn" onclick="modifyStake('double')">2X</div>
                <div class="chip-btn" onclick="setQuickStake(100)">100</div>
                <div class="chip-btn" onclick="modifyStake('max')">MAX</div>
            </div>

            <!-- THE MASTER DYNAMIC BUTTON -->
            <button class="main-action-btn btn-state-bet" id="btnMasterAction" onclick="handleMasterAction()">
                <span>BET</span>
            </button>

            <!-- Real Live Players List -->
            <div class="bets-container">
                <div class="bets-header">
                    <span>ALL BETS</span>
                    <span id="txtTotalBetsCount">0 Bets</span>
                </div>
                <div class="bets-list" id="listRealBets">
                    <div style="text-align: center; color: #475569; font-size: 11px; padding: 20px;">No bets yet</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase Config (Exact match to your credentials)
    const firebaseConfig = {
        apiKey: "AIzaSyAb8YsPMOY53GxiycCL6G0MPZdgWe3nnyY",
        authDomain: "movie-92659.firebaseapp.com",
        databaseURL: "https://movie-92659-default-rtdb.firebaseio.com",
        projectId: "movie-92659",
        storageBucket: "movie-92659.firebasestorage.app",
        messagingSenderId: "1090734362509",
        appId: "1:1090734362509:web:86be5583f6e8fcfdfa77c4"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let currentUser = null;
    let userBalance = 0;
    let userName = 'Player';

    // Round States
    const ROUND_COUNTDOWN = 'COUNTDOWN';
    const ROUND_FLYING = 'FLYING';
    const ROUND_CRASHED = 'CRASHED';

    let currentRoundState = ROUND_COUNTDOWN;
    let currentMultiplier = 1.00;
    let targetCrashPoint = 2.00;
    let roundStartTime = 0;

    // User Bet State in Current Round: 'NONE' | 'PLACED' | 'CASHED_OUT' | 'LOST'
    let myBetState = 'NONE';
    let myBetAmount = 50;

    // Canvas references
    const canvas = document.getElementById('flightCanvas');
    const ctx = canvas.getContext('2d');
    let canvasW, canvasH;
    let planeX = 0, planeY = 0;
    let gridShift = 0;

    // Authenticate
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            database.ref('users/' + user.uid).on('value', (snap) => {
                if (snap.exists()) {
                    const data = snap.val();
                    userBalance = Number(data.balance || 0);
                    userName = data.name || 'Player';
                    document.getElementById('txtUserBalance').innerText = `৳ ${userBalance.toFixed(2)}`;
                }
            });
            startAutonomousGameEngine();
        } else {
            window.location.href = 'index.html';
        }
    });

    // Auto-Resize Canvas for PC and Mobile with Retina Crispness
    function resizeCanvas() {
        const pane = document.getElementById('stagePane');
        const dpr = window.devicePixelRatio || 1;
        canvasW = pane.clientWidth;
        canvasH = pane.clientHeight;
        canvas.width = canvasW * dpr;
        canvas.height = canvasH * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    // -------------------------------------------------------------------------
    // Bulletproof Standalone Realtime Engine (No Host Desync Issues)
    // -------------------------------------------------------------------------
    function startAutonomousGameEngine() {
        // Listen to live bets table
        database.ref('crash_bets').on('value', (snap) => {
            renderBetsList(snap.val() || {});
        });

        // Initialize first round
        startCountdown();
        requestAnimationFrame(renderLoop);
    }

    function generateRealisticCrashPoint() {
        const rand = Math.random();
        // 5% instant crash at 1.00x, else exponential distribution
        if (rand < 0.05) return 1.00;
        let pt = parseFloat((0.98 / (1 - rand)).toFixed(2));
        if (pt > 100) pt = 100;
        return pt;
    }

    function startCountdown() {
        currentRoundState = ROUND_COUNTDOWN;
        currentMultiplier = 1.00;
        targetCrashPoint = generateRealisticCrashPoint();

        // Reset user bet state if new round
        if (myBetState !== 'PLACED') {
            myBetState = 'NONE';
        }

        const countdownDuration = 5000; // 5 Seconds
        const startTimestamp = Date.now();

        document.getElementById('txtStatus').className = 'stage-status status-wait';
        document.getElementById('txtMultiplier').innerText = '1.00x';
        document.getElementById('txtMultiplier').style.color = '#ffffff';

        const timer = setInterval(() => {
            const elapsed = Date.now() - startTimestamp;
            const remaining = Math.max(0, countdownDuration - elapsed);
            const seconds = (remaining / 1000).toFixed(1);

            document.getElementById('txtStatus').innerText = `NEXT ROUND IN ${seconds}s`;
            document.getElementById('fillCountdown').style.width = ((remaining / countdownDuration) * 100) + '%';

            updateMasterButtonUI();

            if (remaining <= 0) {
                clearInterval(timer);
                launchFlight();
            }
        }, 100);
    }

    function launchFlight() {
        currentRoundState = ROUND_FLYING;
        roundStartTime = Date.now();
        document.getElementById('fillCountdown').style.width = '0%';
        document.getElementById('txtStatus').className = 'stage-status status-fly';
        document.getElementById('txtStatus').innerText = 'FLYING...';
        updateMasterButtonUI();
    }

    function triggerCrash() {
        currentRoundState = ROUND_CRASHED;
        document.getElementById('txtStatus').className = 'stage-status status-crash';
        document.getElementById('txtStatus').innerText = 'FLEW AWAY!';
        document.getElementById('txtMultiplier').innerText = targetCrashPoint.toFixed(2) + 'x';
        document.getElementById('txtMultiplier').style.color = 'var(--primary-red)';

        if (myBetState === 'PLACED') {
            myBetState = 'LOST';
        }

        updateMasterButtonUI();
        addHistoryChip(targetCrashPoint);

        // Wait 3 seconds, then start fresh 5s countdown
        setTimeout(() => {
            database.ref('crash_bets').remove(); // clear bets for next round
            startCountdown();
        }, 3000);
    }

    // -------------------------------------------------------------------------
    // Render Loop (Keeps Plane on Screen Forever)
    // -------------------------------------------------------------------------
    function renderLoop(time) {
        ctx.clearRect(0, 0, canvasW, canvasH);
        drawGridLines();

        if (currentRoundState === ROUND_FLYING) {
            const flightTime = (Date.now() - roundStartTime) / 1000;
            // Multiplier curve
            currentMultiplier = parseFloat(Math.pow(Math.E, 0.065 * flightTime).toFixed(2));

            if (currentMultiplier >= targetCrashPoint) {
                currentMultiplier = targetCrashPoint;
                triggerCrash();
            } else {
                document.getElementById('txtMultiplier').innerText = currentMultiplier.toFixed(2) + 'x';
                updateMasterButtonUI();
            }

            // Screen boundary clamping logic: Plane reaches 75% width & 35% height and stays there
            const progress = Math.min(1, flightTime / 6.5);
            const anchorX = canvasW * 0.75;
            const anchorY = canvasH * 0.35;

            planeX = 50 + (anchorX - 50) * progress;
            planeY = (canvasH - 60) - ((canvasH - 60) - anchorY) * progress;
            planeY += Math.sin(time / 140) * 4; // natural hover

            drawFlightTrail(planeX, planeY);
            drawPlane(planeX, planeY);

        } else if (currentRoundState === ROUND_COUNTDOWN) {
            planeX = 50;
            planeY = canvasH - 60;
            drawPlane(planeX, planeY);
        } else if (currentRoundState === ROUND_CRASHED) {
            // Blast away off screen
            planeX += 18;
            planeY -= 10;
            drawPlane(planeX, planeY);
        }

        requestAnimationFrame(renderLoop);
    }

    function drawGridLines() {
        ctx.strokeStyle = '#121c2e';
        ctx.lineWidth = 1;
        gridShift = (gridShift + 1.2) % 40;

        for (let x = -gridShift; x < canvasW; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvasH);
            ctx.stroke();
        }
        for (let y = 0; y < canvasH; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvasW, y);
            ctx.stroke();
        }
    }

    function drawFlightTrail(px, py) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(35, canvasH - 45);
        ctx.quadraticCurveTo(px * 0.45, canvasH - 45, px, py);
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 10;
        ctx.stroke();

        ctx.lineTo(px, canvasH - 45);
        ctx.lineTo(35, canvasH - 45);
        ctx.fillStyle = 'rgba(244, 63, 94, 0.08)';
        ctx.fill();
        ctx.restore();
    }

    function drawPlane(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-18 * Math.PI / 180);

        // Body
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.ellipse(0, 0, 18, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Wings
        ctx.fillStyle = '#b91c1c';
        ctx.beginPath();
        ctx.moveTo(-4, 0);
        ctx.lineTo(-12, 14);
        ctx.lineTo(4, 0);
        ctx.fill();

        // Glass
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.ellipse(6, -2, 5, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Exhaust Fire
        if (currentRoundState === ROUND_FLYING) {
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(-18, -2);
            ctx.lineTo(-26 + Math.random() * -6, 0);
            ctx.lineTo(-18, 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // -------------------------------------------------------------------------
    // Button Logic: BET -> CANCEL -> CASH OUT
    // -------------------------------------------------------------------------
    function updateMasterButtonUI() {
        const btn = document.getElementById('btnMasterAction');

        if (currentRoundState === ROUND_COUNTDOWN) {
            if (myBetState === 'PLACED') {
                btn.className = 'main-action-btn btn-state-cancel';
                btn.innerHTML = `<span>CANCEL (৳${myBetAmount})</span>`;
            } else {
                const stake = Number(document.getElementById('inputBetAmount').value) || 50;
                btn.className = 'main-action-btn btn-state-bet';
                btn.innerHTML = `<span>BET ৳${stake}</span>`;
            }
        } else if (currentRoundState === ROUND_FLYING) {
            if (myBetState === 'PLACED') {
                const cashoutAmount = (myBetAmount * currentMultiplier).toFixed(2);
                btn.className = 'main-action-btn btn-state-cashout';
                btn.innerHTML = `<span>CASH OUT</span><span style="font-size: 13px;">৳${cashoutAmount}</span>`;
            } else if (myBetState === 'CASHED_OUT') {
                btn.className = 'main-action-btn btn-state-disabled';
                btn.innerHTML = `<span>CASHED OUT</span>`;
            } else {
                btn.className = 'main-action-btn btn-state-disabled';
                btn.innerHTML = `<span>WAITING FOR NEXT ROUND</span>`;
            }
        } else if (currentRoundState === ROUND_CRASHED) {
            btn.className = 'main-action-btn btn-state-disabled';
            btn.innerHTML = `<span>FLEW AWAY</span>`;
        }
    }

    function handleMasterAction() {
        if (currentRoundState === ROUND_COUNTDOWN) {
            if (myBetState === 'NONE') {
                // PLACE BET
                const amt = Number(document.getElementById('inputBetAmount').value);
                if (isNaN(amt) || amt < 10) {
                    Swal.fire({ icon: 'warning', title: 'Minimum Bet', text: 'Minimum bet is ৳10', confirmButtonColor: '#f43f5e' });
                    return;
                }
                if (amt > userBalance) {
                    Swal.fire({ icon: 'error', title: 'Insufficient Balance', text: 'Add money to your account.', confirmButtonColor: '#f43f5e' });
                    return;
                }

                myBetAmount = amt;
                userBalance -= myBetAmount;
                database.ref('users/' + currentUser.uid).update({ balance: userBalance });

                // Register Bet in Database
                database.ref('crash_bets/' + currentUser.uid).set({
                    name: userName,
                    amount: myBetAmount,
                    cashedOut: false,
                    multiplier: 0
                });

                myBetState = 'PLACED';
                updateMasterButtonUI();

            } else if (myBetState === 'PLACED') {
                // CANCEL BET BEFORE ROUND STARTS (REFUND FULL)
                userBalance += myBetAmount;
                database.ref('users/' + currentUser.uid).update({ balance: userBalance });
                database.ref('crash_bets/' + currentUser.uid).remove();

                myBetState = 'NONE';
                updateMasterButtonUI();
            }
        } else if (currentRoundState === ROUND_FLYING) {
            if (myBetState === 'PLACED') {
                // CASH OUT
                myBetState = 'CASHED_OUT';
                const wonMultiplier = currentMultiplier;
                const wonAmount = parseFloat((myBetAmount * wonMultiplier).toFixed(2));
                userBalance += wonAmount;

                database.ref('users/' + currentUser.uid).update({ balance: userBalance });
                database.ref('crash_bets/' + currentUser.uid).update({
                    cashedOut: true,
                    multiplier: wonMultiplier,
                    winAmount: wonAmount
                });

                updateMasterButtonUI();

                Swal.fire({
                    icon: 'success',
                    title: `Won ৳${wonAmount}!`,
                    text: `Multiplier: ${wonMultiplier.toFixed(2)}x`,
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        }
    }

    // -------------------------------------------------------------------------
    // Utilities & Stake Controls
    // -------------------------------------------------------------------------
    function modifyStake(type) {
        let cur = Number(document.getElementById('inputBetAmount').value) || 50;
        if (type === 'half') cur = Math.max(10, Math.floor(cur / 2));
        if (type === 'double') cur = Math.min(10000, cur * 2);
        if (type === 'max') cur = Math.floor(userBalance);
        document.getElementById('inputBetAmount').value = cur;
        updateMasterButtonUI();
    }

    function setQuickStake(val) {
        document.getElementById('inputBetAmount').value = val;
        updateMasterButtonUI();
    }

    function renderBetsList(bets) {
        const container = document.getElementById('listRealBets');
        const keys = Object.keys(bets);
        document.getElementById('txtTotalBetsCount').innerText = `${keys.length} Bets`;

        if (keys.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: #475569; font-size: 11px; padding: 20px;">Waiting for bets...</div>`;
            return;
        }

        container.innerHTML = '';
        keys.forEach(uid => {
            const b = bets[uid];
            const div = document.createElement('div');
            div.className = 'bet-entry';
            div.innerHTML = `
                <div class="user-tag"><i class="fa-solid fa-user"></i> ${b.name || 'User'}</div>
                <div>
                    <span style="color:#94a3b8;">৳${b.amount}</span>
                    ${b.cashedOut 
                        ? `<span class="win-tag"> ৳${b.winAmount} (${b.multiplier}x)</span>`
                        : `<span style="color:#f59e0b; font-size: 11px;"> IN PLAY</span>`
                    }
                </div>
            `;
            container.appendChild(div);
        });
    }

    function addHistoryChip(multiplier) {
        const bar = document.getElementById('historyStrip');
        const chip = document.createElement('span');
        chip.className = 'chip ' + (multiplier >= 10 ? 'gold' : multiplier >= 2 ? 'purple' : 'blue');
        chip.innerText = multiplier.toFixed(2) + 'x';
        bar.insertBefore(chip, bar.firstChild);
        if (bar.children.length > 20) bar.removeChild(bar.lastChild);
    }
</script>
</body>
