<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tioFlight - Realtime Crash Arena</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #111827;
            --card-inner: #1a2234;
            --primary-red: #ef4444;
            --primary-green: #22c55e;
            --accent-yellow: #f59e0b;
            --border-glow: rgba(239, 68, 68, 0.25);
            --text-white: #ffffff;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header {
            height: 60px;
            background: rgba(17, 24, 39, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .logo-img {
            height: 34px;
            object-fit: contain;
        }

        .user-balance-pill {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.05));
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 6px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-balance-pill span {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
        }

        .user-balance-pill strong {
            font-size: 15px;
            color: #4ade80;
            font-weight: 800;
        }

        /* Main Workspace Layout */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 12px;
            padding: 12px;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Left Live Board */
        .live-board-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .board-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dim);
        }

        .board-header span i {
            color: var(--primary-green);
            margin-right: 6px;
        }

        .live-bets-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .live-bets-list::-webkit-scrollbar { width: 4px; }
        .live-bets-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 6px;
            font-size: 12.5px;
            transition: all 0.3s ease;
        }

        .bet-row.cashed {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .bet-user {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .bet-user i { font-size: 11px; color: var(--text-dim); }

        .bet-amount { font-weight: 700; color: #f8fafc; }
        .bet-mult { color: #4ade80; font-weight: 800; }

        /* Right Arena */
        .game-right-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            overflow: hidden;
        }

        /* History Strip */
        .history-strip {
            height: 38px;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 0 4px;
        }

        .history-strip::-webkit-scrollbar { display: none; }

        .history-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 11.5px;
            font-weight: 800;
            color: #93c5fd;
            white-space: nowrap;
        }

        .history-pill.high { color: #facc15; border-color: rgba(250, 204, 21, 0.4); }
        .history-pill.low { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }

        /* Flight Stage */
        .flight-stage {
            flex: 1;
            background: radial-gradient(circle at 40% 60%, #151d2f 0%, #0a0e17 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
        }

        /* Flight Grid Canvas */
        .grid-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.02);
        }
        .grid-x { width: 100%; height: 1px; left: 0; }
        .grid-y { height: 100%; width: 1px; top: 0; }

        /* Multiplier & Status display */
        .stage-center-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }

        .big-multiplier {
            font-size: clamp(52px, 8vw, 88px);
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: color 0.2s;
        }

        .big-multiplier.crashed {
            color: #ef4444;
            text-shadow: 0 0 35px rgba(239, 68, 68, 0.5);
        }

        .stage-status-badge {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: -6px;
        }

        /* Plane Design */
        .flight-carrier {
            position: absolute;
            bottom: 60px;
            left: 60px;
            z-index: 4;
            transition: transform 0.08s linear;
            display: flex;
            align-items: center;
        }

        .carrier-plane {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* tioFlight Branding on Plane */
        .plane-label {
            background: linear-gradient(90deg, #ef4444, #f97316);
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            margin-bottom: 4px;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .plane-svg-box {
            width: 72px;
            height: 72px;
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.7));
            transform: rotate(-15deg);
        }

        .jet-flame {
            position: absolute;
            left: -20px;
            bottom: 22px;
            width: 25px;
            height: 10px;
            background: linear-gradient(to left, #f59e0b, #ef4444, transparent);
            border-radius: 50%;
            filter: blur(1px);
            animation: flameFlicker 0.1s infinite alternate;
        }

        @keyframes flameFlicker {
            0% { transform: scaleX(0.8) scaleY(0.9); opacity: 0.8; }
            100% { transform: scaleX(1.3) scaleY(1.1); opacity: 1; }
        }

        /* Control Deck */
        .control-deck {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .bet-inputs-group {
            flex: 1;
        }

        .bet-bar {
            display: flex;
            background: var(--card-inner);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 10px;
        }

        .bet-input-box {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px 14px;
            font-size: 18px;
            font-weight: 800;
            outline: none;
        }

        .chips-row {
            display: flex;
            gap: 8px;
        }

        .chip-btn {
            flex: 1;
            background: var(--card-inner);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            padding: 8px 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .chip-btn:hover, .chip-btn.active {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--primary-red);
            color: #fff;
        }

        /* Action Bet / Cashout Button */
        .main-action-btn {
            width: 220px;
            height: 78px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.1s, filter 0.2s;
        }

        .main-action-btn:active { transform: scale(0.97); }

        .btn-state-bet {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            color: #fff;
        }

        .btn-state-waiting {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            color: #cbd5e1;
            cursor: not-allowed;
        }

        .btn-state-cashout {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
            color: #fff;
        }

        .main-action-btn .btn-title {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .main-action-btn .btn-sub {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.9;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
                height: auto;
                overflow-y: auto;
            }
            body { overflow-y: auto; height: auto; }
            .live-board-panel { height: 200px; order: 2; }
            .flight-stage { height: 320px; }
            .control-deck { flex-direction: column; }
            .main-action-btn { width: 100%; height: 60px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-zone">
            <a href="javascript:history.back()" class="back-btn" title="Back to App">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <img src="https://crashgames.co.za/wp-content/uploads/crash-games-logo.png" alt="tioFlight Logo" class="logo-img">
        </div>
        <div class="user-balance-pill">
            <span>ব্যালেন্স:</span>
            <strong id="balanceText">৳ 0.00</strong>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        
        <!-- Left: Live Bets Board -->
        <div class="live-board-panel">
            <div class="board-header">
                <span><i class="fa-solid fa-circle"></i> লাইভ প্লেয়ারস</span>
                <span id="totalPlayersCount">০ জন যুক্ত</span>
            </div>
            <div class="live-bets-list" id="liveBetsList">
                <!-- Players will populate here dynamically -->
            </div>
        </div>

        <!-- Right: Game Display Area -->
        <div class="game-right-panel">
            
            <!-- History Badges -->
            <div class="history-strip" id="historyStrip">
                <div class="history-pill high">3.45x</div>
                <div class="history-pill low">1.18x</div>
                <div class="history-pill high">7.80x</div>
                <div class="history-pill low">1.05x</div>
                <div class="history-pill">2.14x</div>
            </div>

            <!-- Flying Arena -->
            <div class="flight-stage" id="flightStage">
                <!-- Background Grid Lines -->
                <div class="grid-line grid-x" style="bottom: 25%;"></div>
                <div class="grid-line grid-x" style="bottom: 50%;"></div>
                <div class="grid-line grid-x" style="bottom: 75%;"></div>
                <div class="grid-line grid-y" style="left: 25%;"></div>
                <div class="grid-line grid-y" style="left: 50%;"></div>
                <div class="grid-line grid-y" style="left: 75%;"></div>

                <!-- Multiplier Center -->
                <div class="stage-center-info">
                    <div class="big-multiplier" id="multiplierNum">1.00x</div>
                    <div class="stage-status-badge" id="stageStatus">উড্ডয়নের অপেক্ষায়...</div>
                </div>

                <!-- Jet Carrier with tioFlight branding -->
                <div class="flight-carrier" id="flightCarrier">
                    <div class="carrier-plane">
                        <div class="plane-label">tioFlight</div>
                        <div style="position: relative;">
                            <div class="jet-flame" id="jetFlame"></div>
                            <!-- Stylish Modern Supersonic Jet SVG -->
                            <svg class="plane-svg-box" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M92 48L45 28C42 27 38 29 38 32V42L15 36C13 35 11 36 11 38V44C11 46 12 47 14 48L38 52V62L26 66C24 67 23 69 23 71V75L39 72L49 84C51 86 54 85 55 83L60 70L92 56C95 55 96 50 92 48Z" fill="url(#planeGrad)" stroke="#ffffff" stroke-width="2"/>
                                <defs>
                                    <linearGradient id="planeGrad" x1="10" y1="30" x2="95" y2="70" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#ef4444"/>
                                        <stop offset="0.5" stop-color="#dc2626"/>
                                        <stop offset="1" stop-color="#991b1b"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls Deck -->
            <div class="control-deck">
                <div class="bet-inputs-group">
                    <div class="bet-bar">
                        <span style="display: flex; align-items: center; padding-left: 12px; font-weight: 800; color: #ef4444;">৳</span>
                        <input type="number" class="bet-input-box" id="betAmountInput" value="5" min="5" step="5">
                    </div>
                    <div class="chips-row">
                        <button class="chip-btn" onclick="selectChip(5)">৳ ৫</button>
                        <button class="chip-btn" onclick="selectChip(10)">৳ ১০</button>
                        <button class="chip-btn" onclick="selectChip(15)">৳ ১৫</button>
                        <button class="chip-btn" onclick="selectChip(20)">৳ ২০</button>
                    </div>
                </div>

                <button class="main-action-btn btn-state-bet" id="actionBtn" onclick="handleActionButton()">
                    <span class="btn-title" id="btnTitleText">বাজি ধরুন</span>
                    <span class="btn-sub" id="btnSubText">পরবর্তী রাউন্ডের জন্য</span>
                </button>
            </div>

        </div>

    </div>

    <script>
        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyAb8YsPMOY53GxiycCL6G0MPZdgWe3nnyY",
            authDomain: "movie-92659.firebaseapp.com",
            databaseURL: "https://movie-92659-default-rtdb.firebaseio.com",
            projectId: "movie-92659",
            storageBucket: "movie-92659.firebasestorage.app",
            messagingSenderId: "1090734362509",
            appId: "1:1090734362509:web:86be5583f6e8fcfdfa77c4",
            measurementId: "G-XF1TEP0DSJ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let userBalance = 0;

        // Game Core States
        let roundState = 'WAITING'; // 'WAITING', 'FLYING', 'CRASHED'
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let flightInterval = null;
        let countdownTimer = null;

        // Player's Bet State
        let hasActiveBet = false;
        let betQueued = false;
        let playerBetAmount = 0;

        // Simulated Live Players
        let botPlayers = [];
        const botNames = ['Rahim', 'Tanvir', 'Hasan', 'Shuvo', 'Akash', 'Mim', 'Nayeem', 'Sajib', 'Arif', 'Bijoy', 'Fahim', 'Sumon'];

        // Auth & Firebase Balance Sync
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                database.ref('users/' + user.uid).on('value', (snap) => {
                    if (snap.exists()) {
                        userBalance = snap.val().balance || 0;
                        document.getElementById('balanceText').innerText = `৳ ${userBalance.toFixed(2)}`;
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        function selectChip(amount) {
            document.getElementById('betAmountInput').value = amount;
        }

        // Initialize Flight Engine
        window.onload = () => {
            startCountdown();
        };

        // 1. 5-Second Countdown Before Takeoff
        function startCountdown() {
            roundState = 'WAITING';
            let secondsLeft = 5;

            // Reset Plane
            const carrier = document.getElementById('flightCarrier');
            carrier.style.transition = 'none';
            carrier.style.transform = `translate(0px, 0px)`;
            carrier.style.opacity = '1';
            document.getElementById('jetFlame').style.display = 'none';

            const multNum = document.getElementById('multiplierNum');
            multNum.className = 'big-multiplier';
            multNum.innerText = '1.00x';

            const status = document.getElementById('stageStatus');

            // Generate Simulated Players for this round
            generateLivePlayers();

            // Check if player queued a bet
            if (betQueued) {
                deductBet();
            } else {
                updateButtonUI();
            }

            countdownTimer = setInterval(() => {
                status.innerText = `পরবর্তী ফ্লাইট: ${secondsLeft} সে.`;
                secondsLeft--;

                if (secondsLeft < 0) {
                    clearInterval(countdownTimer);
                    launchFlight();
                }
            }, 1000);
        }

        // 2. Launch Flight
        function launchFlight() {
            roundState = 'FLYING';
            currentMultiplier = 1.00;
            document.getElementById('stageStatus').innerText = 'উড্ডয়ন চলছে...';
            document.getElementById('jetFlame').style.display = 'block';

            // Crash Algorithm (Realistic aviator style)
            // 60% chance: 1.10x - 2.50x
            // 30% chance: 2.50x - 6.00x
            // 10% chance: 6.00x - 18.00x
            const rand = Math.random();
            if (rand < 0.60) {
                crashPoint = 1.10 + Math.random() * 1.4;
            } else if (rand < 0.90) {
                crashPoint = 2.50 + Math.random() * 3.5;
            } else {
                crashPoint = 6.00 + Math.random() * 12.0;
            }
            crashPoint = parseFloat(crashPoint.toFixed(2));

            updateButtonUI();

            const stage = document.getElementById('flightStage');
            const carrier = document.getElementById('flightCarrier');
            const multNum = document.getElementById('multiplierNum');

            const maxTranslateX = stage.clientWidth - 160;
            const maxTranslateY = -(stage.clientHeight - 140);

            carrier.style.transition = 'transform 0.08s linear';

            flightInterval = setInterval(() => {
                // Growth pace accelerates gradually
                const step = 0.01 + (currentMultiplier * 0.006);
                currentMultiplier += step;
                multNum.innerText = `${currentMultiplier.toFixed(2)}x`;

                // Smooth Jet Path Curve
                const progress = Math.min((currentMultiplier - 1) / 4.5, 1);
                const currentX = progress * maxTranslateX;
                const currentY = Math.pow(progress, 1.2) * maxTranslateY;

                carrier.style.transform = `translate(${currentX}px, ${currentY}px)`;

                // Update Player cashout button value
                if (hasActiveBet) {
                    document.getElementById('btnSubText').innerText = `৳ ${(playerBetAmount * currentMultiplier).toFixed(2)}`;
                }

                // Simulate Live Players Cashout
                updateBotCashouts(currentMultiplier);

                // Crash Event
                if (currentMultiplier >= crashPoint) {
                    triggerCrash();
                }
            }, 80);
        }

        // 3. Trigger Crash Event
        function triggerCrash() {
            clearInterval(flightInterval);
            roundState = 'CRASHED';

            const multNum = document.getElementById('multiplierNum');
            multNum.className = 'big-multiplier crashed';
            multNum.innerText = 'CRASHED';

            document.getElementById('stageStatus').innerText = `@ ${crashPoint.toFixed(2)}x এ উড়ে গেছে!`;
            document.getElementById('jetFlame').style.display = 'none';

            // Plane disappears
            const carrier = document.getElementById('flightCarrier');
            carrier.style.opacity = '0';

            // Add to history strip
            appendHistory(crashPoint);

            // If user had active bet and did not cashout -> Lost
            if (hasActiveBet) {
                hasActiveBet = false;
            }

            betQueued = false;
            updateButtonUI();

            // Automatically schedule next round in exactly 5 seconds
            setTimeout(() => {
                startCountdown();
            }, 5000);
        }

        // Handle Main Button Action
        function handleActionButton() {
            if (roundState === 'WAITING') {
                if (!betQueued) {
                    queueBet();
                } else {
                    cancelQueuedBet();
                }
            } else if (roundState === 'FLYING') {
                if (hasActiveBet) {
                    cashOut();
                } else if (!betQueued) {
                    queueBet();
                } else {
                    cancelQueuedBet();
                }
            } else if (roundState === 'CRASHED') {
                if (!betQueued) {
                    queueBet();
                } else {
                    cancelQueuedBet();
                }
            }
        }

        function queueBet() {
            const inputVal = parseFloat(document.getElementById('betAmountInput').value);
            if (isNaN(inputVal) || inputVal < 5) {
                Swal.fire({ icon: 'warning', title: 'কম পরিমাণ', text: 'সর্বনিম্ন বাজি ৫ টাকা।' });
                return;
            }
            if (inputVal > userBalance) {
                Swal.fire({ icon: 'error', title: 'অপর্যাপ্ত ব্যালেন্স', text: 'আপনার ব্যালেন্সে পর্যাপ্ত টাকা নেই।' });
                return;
            }

            betQueued = true;
            playerBetAmount = inputVal;
            updateButtonUI();
        }

        function cancelQueuedBet() {
            betQueued = false;
            updateButtonUI();
        }

        function deductBet() {
            if (!currentUser) return;
            if (playerBetAmount > userBalance) {
                betQueued = false;
                hasActiveBet = false;
                updateButtonUI();
                return;
            }

            hasActiveBet = true;
            betQueued = false;

            // Deduct immediately from Firebase Realtime DB
            const newBal = userBalance - playerBetAmount;
            database.ref('users/' + currentUser.uid).update({ balance: newBal });

            updateButtonUI();
        }

        function cashOut() {
            if (!hasActiveBet || roundState !== 'FLYING') return;

            hasActiveBet = false;
            const winAmount = parseFloat((playerBetAmount * currentMultiplier).toFixed(2));
            const newBal = userBalance + winAmount;

            // Update Winning in Firebase Realtime DB
            database.ref('users/' + currentUser.uid).update({ balance: newBal });

            Swal.fire({
                icon: 'success',
                title: 'ক্যাশআউট সফল!',
                text: `আপনি জিতেছেন ৳ ${winAmount} (${currentMultiplier.toFixed(2)}x)`,
                timer: 1800,
                showConfirmButton: false
            });

            updateButtonUI();
        }

        // Dynamic Button UI Handler
        function updateButtonUI() {
            const btn = document.getElementById('actionBtn');
            const title = document.getElementById('btnTitleText');
            const sub = document.getElementById('btnSubText');

            if (roundState === 'FLYING' && hasActiveBet) {
                btn.className = 'main-action-btn btn-state-cashout';
                title.innerText = 'ক্যাশআউট';
                sub.innerText = `৳ ${(playerBetAmount * currentMultiplier).toFixed(2)}`;
            } else if (betQueued) {
                btn.className = 'main-action-btn btn-state-waiting';
                title.innerText = 'বাতিল করুন';
                sub.innerText = 'পরবর্তী ফ্লাইটে বাজি ধরা আছে';
            } else {
                btn.className = 'main-action-btn btn-state-bet';
                title.innerText = 'বাজি ধরুন';
                sub.innerText = (roundState === 'FLYING') ? 'পরবর্তী রাউন্ডের জন্য' : 'ফ্লাইটের জন্য প্রস্তুত';
            }
        }

        // Live Simulated Players Generator
        function generateLivePlayers() {
            const container = document.getElementById('liveBetsList');
            container.innerHTML = '';
            botPlayers = [];

            const playerCount = Math.floor(Math.random() * 8) + 6;
            document.getElementById('totalPlayersCount').innerText = `${playerCount} জন বাজি ধরেছে`;

            for (let i = 0; i < playerCount; i++) {
                const name = botNames[Math.floor(Math.random() * botNames.length)] + ' ' + (Math.floor(Math.random() * 89) + 10);
                const amount = [5, 10, 15, 20, 50, 100][Math.floor(Math.random() * 6)];
                const exitX = parseFloat((1.2 + Math.random() * 3.5).toFixed(2));

                botPlayers.push({ name, amount, exitX, cashed: false });

                const div = document.createElement('div');
                div.className = 'bet-row';
                div.id = `bot-row-${i}`;
                div.innerHTML = `
                    <div class="bet-user"><i class="fa-solid fa-user-astronaut"></i> ${name}</div>
                    <div class="bet-amount">৳ ${amount}</div>
                    <div class="bet-mult" id="bot-mult-${i}">-</div>
                `;
                container.appendChild(div);
            }
        }

        function updateBotCashouts(currentX) {
            botPlayers.forEach((bot, index) => {
                if (!bot.cashed && currentX >= bot.exitX && currentX < crashPoint) {
                    bot.cashed = true;
                    const row = document.getElementById(`bot-row-${index}`);
                    const multCol = document.getElementById(`bot-mult-${index}`);
                    if (row && multCol) {
                        row.classList.add('cashed');
                        multCol.innerText = `${bot.exitX.toFixed(2)}x`;
                    }
                }
            });
        }

        // Add history pill
        function appendHistory(val) {
            const strip = document.getElementById('historyStrip');
            const pill = document.createElement('div');
            pill.className = `history-pill ${val >= 2.0 ? 'high' : 'low'}`;
            pill.innerText = `${val.toFixed(2)}x`;
            strip.insertBefore(pill, strip.firstChild);

            if (strip.children.length > 15) {
                strip.removeChild(strip.lastChild);
            }
        }
    </script>
</body>
</html>
