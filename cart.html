<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="cartPageTitle">Shopping Cart | Online Store</title>
  
  <!-- Favicon -->
  <link id="pageFavicon" rel="icon" type="image/jpeg" href="https://i.postimg.cc/Y28MDVJr/FB-IMG-1788689035157.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="antialiased selection:bg-black selection:text-white min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a id="cartBackLink" href="index.html" class="w-9 h-9 rounded-lg border border-gray-200 flex items-center justify-center text-black hover:bg-gray-50 transition active:scale-95">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </a>
        <div class="flex items-center gap-2">
          <img id="cartHeaderLogo" src="https://i.postimg.cc/Y28MDVJr/FB-IMG-1788689035157.jpg" alt="Logo" class="w-7 h-7 rounded-lg object-cover">
          <h1 class="text-base sm:text-lg font-bold text-black"><span id="cartStoreTitle">Shopping Cart</span> (<span id="cartCountHeader">0</span>)</h1>
        </div>
      </div>
      <button onclick="clearCart()" class="text-xs font-semibold text-gray-400 hover:text-black transition">Clear All</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    
    <!-- Empty Cart State -->
    <div id="cartEmptyState" class="hidden text-center py-20 bg-white rounded-2xl border border-gray-100 p-8 shadow-sm">
      <div class="w-16 h-16 bg-gray-50 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-100">
        <i data-lucide="shopping-bag" class="w-7 h-7"></i>
      </div>
      <h3 class="text-base font-bold text-black mb-1">Your cart is empty</h3>
      <p class="text-xs text-gray-500 mb-6">Looks like you haven't added any items to your cart yet.</p>
      <a id="continueShoppingLink" href="index.html" class="inline-block bg-black hover:bg-neutral-800 text-white px-6 py-2.5 rounded-xl text-xs font-semibold transition shadow active:scale-95">
        Continue Shopping
      </a>
    </div>

    <!-- Active Cart Items -->
    <div id="cartContent" class="space-y-6">
      <div id="cartItemsList" class="space-y-3"></div>

      <!-- Price Breakdown Card -->
      <div class="bg-white p-5 sm:p-6 rounded-2xl border border-gray-100 shadow-sm space-y-3 text-xs sm:text-sm">
        <div class="flex justify-between text-gray-500">
          <span>Subtotal</span>
          <span class="font-bold text-black" id="subtotalPrice">BDT 0</span>
        </div>
        <div class="flex justify-between text-gray-500">
          <span>Estimated Delivery</span>
          <span class="text-gray-400">Calculated at checkout</span>
        </div>
        <div class="border-t border-gray-100 pt-3 flex justify-between text-base font-extrabold text-black">
          <span>Total</span>
          <span id="grandTotalPrice">BDT 0</span>
        </div>

        <button onclick="proceedToCheckout()" class="w-full mt-4 bg-black hover:bg-neutral-800 text-white py-3.5 rounded-xl font-bold text-xs tracking-wider uppercase transition active:scale-[0.99] shadow">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </main>

  <script>
    let LOGO_PLACEHOLDER = "https://i.postimg.cc/Y28MDVJr/FB-IMG-1788689035157.jpg";

    // 1. DYNAMIC SHOP RESOLVER (Reads ?shop=slug from URL)
    const urlParams = new URLSearchParams(window.location.search);
    const currentShop = urlParams.get('shop') || 'lowbudget'; // Default to lowbudget

    // Unique Shop-based Cart Key
    const CART_STORAGE_KEY = `cart_${currentShop}`;

    // Update Back & Continue Shopping Links to preserve current shop
    const homeShopUrl = `index.html?shop=${currentShop}`;
    document.getElementById('cartBackLink').href = homeShopUrl;
    document.getElementById('continueShoppingLink').href = homeShopUrl;

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
      authDomain: "new-all-f99f7.firebaseapp.com",
      databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
      projectId: "new-all-f99f7",
      storageBucket: "new-all-f99f7.firebasestorage.app",
      messagingSenderId: "1069748173900",
      appId: "1:1069748173900:web:158d6336c0f4628133c8e9"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. DYNAMIC SETTINGS LISTENER (Store Name, Logo)
    db.ref(`stores/${currentShop}/settings`).on('value', snap => {
      const s = snap.val();
      if (!s) return;

      const storeName = s.storeName || 'Online Store';
      document.title = `Shopping Cart | ${storeName}`;
      document.getElementById('cartStoreTitle').innerText = `${storeName} Cart`;

      if (s.logo) {
        LOGO_PLACEHOLDER = s.logo;
        document.getElementById('cartHeaderLogo').src = s.logo;
        document.getElementById('pageFavicon').href = s.logo;
      }
    });

    let cart = [];

    function loadCart() {
      cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '[]');
      renderCart();
    }

    function renderCart() {
      const emptyState = document.getElementById('cartEmptyState');
      const content = document.getElementById('cartContent');
      const list = document.getElementById('cartItemsList');
      const headerCount = document.getElementById('cartCountHeader');

      const totalItems = cart.reduce((acc, it) => acc + (it.quantity || 1), 0);
      headerCount.innerText = totalItems;

      if (cart.length === 0) {
        emptyState.classList.remove('hidden');
        content.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      content.classList.remove('hidden');
      list.innerHTML = '';

      let subtotal = 0;

      cart.forEach((item, index) => {
        subtotal += item.price * item.quantity;

        const el = document.createElement('div');
        el.className = "bg-white p-4 rounded-2xl border border-gray-100 flex gap-4 items-center shadow-sm";

        let sizeSelect = '';
        if (item.sizes && item.sizes.length > 0) {
          sizeSelect = `
            <div class="flex items-center gap-1.5 mt-1.5">
              <span class="text-[11px] text-gray-400 font-medium">Size:</span>
              <select onchange="updateVariant(${index}, 'selectedSize', this.value)" class="text-xs bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 outline-none font-semibold cursor-pointer">
                ${item.sizes.map(s => {
                  const val = typeof s === 'object' ? s.size : s;
                  return `<option value="${val}" ${val === item.selectedSize ? 'selected' : ''}>${val}</option>`;
                }).join('')}
              </select>
            </div>
          `;
        }

        let colorSelect = '';
        if (item.colors && item.colors.length > 0) {
          colorSelect = `
            <div class="flex items-center gap-1.5 mt-1">
              <span class="text-[11px] text-gray-400 font-medium">Color:</span>
              <select onchange="updateVariant(${index}, 'selectedColor', this.value)" class="text-xs bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 outline-none font-semibold cursor-pointer">
                ${item.colors.map(c => `<option value="${c}" ${c === item.selectedColor ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </div>
          `;
        }

        el.innerHTML = `
          <img src="${item.imageUrl || LOGO_PLACEHOLDER}" alt="${item.name}" class="w-20 h-24 object-cover rounded-xl border border-gray-100 bg-gray-50 shrink-0">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start">
              <h4 class="text-xs sm:text-sm font-semibold text-black truncate">${item.name}</h4>
              <button onclick="removeItem(${index})" class="text-gray-400 hover:text-red-600 p-1 transition" title="Remove Item">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="text-xs font-bold text-black mt-1">BDT ${item.price}</div>
            
            <div class="flex flex-wrap items-center gap-3">
              ${sizeSelect}
              ${colorSelect}
            </div>

            <div class="flex items-center gap-2 mt-3">
              <button onclick="changeQty(${index}, -1)" class="w-7 h-7 rounded-lg border border-gray-200 bg-gray-50 flex items-center justify-center font-bold text-xs hover:bg-gray-100 transition active:scale-95">-</button>
              <span class="text-xs font-bold w-6 text-center">${item.quantity}</span>
              <button onclick="changeQty(${index}, 1)" class="w-7 h-7 rounded-lg border border-gray-200 bg-gray-50 flex items-center justify-center font-bold text-xs hover:bg-gray-100 transition active:scale-95">+</button>
            </div>
          </div>
        `;
        list.appendChild(el);
      });

      document.getElementById('subtotalPrice').innerText = `BDT ${subtotal}`;
      document.getElementById('grandTotalPrice').innerText = `BDT ${subtotal}`;
      lucide.createIcons();
    }

    function changeQty(index, delta) {
      cart[index].quantity += delta;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function updateVariant(index, key, val) {
      cart[index][key] = val;
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      if (confirm('Are you sure you want to clear your cart?')) {
        cart = [];
        localStorage.removeItem(CART_STORAGE_KEY);
        renderCart();
      }
    }

    function proceedToCheckout() {
      if (cart.length === 0) return;
      window.location.href = `checkout.html?fromCart=true&shop=${encodeURIComponent(currentShop)}`;
    }

    loadCart();
  </script>
</body>
</html>
