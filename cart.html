<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title id="cartPageTitle">Shopping Bag | Online Store</title>
  
  <link id="pageFavicon" rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23059669'><circle cx='12' cy='12' r='10'/></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    }
  </script>

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar { height: 4px; width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-slate-900 selection:text-white">

  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-8 h-16 sm:h-20 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <button onclick="handleBackNavigation()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl border border-slate-200 bg-white flex items-center justify-center text-slate-800 hover:bg-slate-100 transition active:scale-95 shadow-xs">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>
        
        <a id="cartBrandLink" href="store.html" class="flex items-center gap-2.5">
          <div id="cartLogoWrap" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center shrink-0">
            <span id="cartLogoFallback" class="text-xs font-black text-slate-700 uppercase">S</span>
            <img id="cartHeaderLogo" src="" alt="Logo" class="w-full h-full object-cover hidden">
          </div>
          <div class="flex items-center gap-2">
            <span id="cartStoreTitle" class="font-extrabold text-base sm:text-lg tracking-tight text-slate-900 truncate max-w-[150px] sm:max-w-xs">Shopping Bag</span>
            <span id="cartCountHeader" class="text-xs font-mono font-bold bg-slate-900 text-white px-2 py-0.5 rounded-full">0</span>
          </div>
        </a>
      </div>

      <button id="clearCartBtn" onclick="clearCart()" class="text-xs font-bold text-slate-400 hover:text-rose-600 transition flex items-center gap-1.5 px-3 py-1.5 rounded-xl hover:bg-rose-50">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Empty Bag</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-8 py-6 sm:py-10 flex-1 w-full pb-28 md:pb-12">
    
    <div id="cartEmptyState" class="hidden text-center py-20 bg-white rounded-3xl border border-slate-200/90 p-8 shadow-xs max-w-sm mx-auto mt-6">
      <div class="w-16 h-16 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-slate-200">
        <i data-lucide="shopping-bag" class="w-8 h-8 text-slate-700"></i>
      </div>
      <h3 class="text-base font-extrabold text-slate-900 mb-1">Your bag is empty</h3>
      <p class="text-xs text-slate-400 mb-6 font-medium leading-relaxed">Looks like you haven't added anything to your cart yet.</p>
      <button onclick="handleBackNavigation()" class="inline-flex items-center justify-center gap-2 w-full bg-slate-900 hover:bg-black text-white px-6 py-3.5 rounded-xl text-xs font-bold transition shadow-sm active:scale-95">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Start Shopping</span>
      </button>
    </div>

    <div id="cartContent" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-10 items-start">
      
      <div class="lg:col-span-7 xl:col-span-8 space-y-3" id="cartItemsList"></div>

      <div class="lg:col-span-5 xl:col-span-4 sticky top-24">
        <div class="bg-white p-5 sm:p-7 rounded-3xl border border-slate-200/90 shadow-xs space-y-4">
          
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-500">Order Summary</h2>
            <span class="text-xs font-mono font-bold text-slate-400" id="summaryTotalItems">0 items</span>
          </div>

          <div class="space-y-2.5 text-xs sm:text-sm">
            <div class="flex justify-between text-slate-600">
              <span>Items Total:</span>
              <span class="font-bold text-slate-900 font-mono" id="subtotalPrice">BDT 0</span>
            </div>
            
            <div class="flex justify-between text-slate-600 items-center">
              <span>Estimated Shipping:</span>
              <span class="text-xs font-semibold text-slate-400" id="deliveryFeeNotice">Calculated at Checkout</span>
            </div>

            <div id="freeDeliveryNoticeWrap" class="hidden bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl text-emerald-800 text-xs font-bold flex items-center gap-2">
              <i data-lucide="sparkles" class="w-4 h-4 text-emerald-600 shrink-0"></i>
              <span>Free Delivery included in this order</span>
            </div>
          </div>

          <div class="border-t border-slate-100 pt-3.5 flex justify-between items-baseline">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-700">Subtotal Payable</span>
            <span class="text-xl sm:text-2xl font-black text-slate-900 font-mono" id="grandTotalPrice">BDT 0</span>
          </div>

          <button onclick="proceedToCheckout()" class="w-full bg-slate-900 hover:bg-black text-white py-4 rounded-xl font-bold text-xs sm:text-sm tracking-wide transition active:scale-[0.99] shadow-sm flex items-center justify-center gap-2">
            <span>Proceed to Checkout</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>

          <button onclick="handleBackNavigation()" class="w-full bg-slate-50 hover:bg-slate-100 text-slate-700 py-3 rounded-xl font-bold text-xs transition flex items-center justify-center gap-1.5 border border-slate-200">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Continue Shopping</span>
          </button>

          <div class="pt-2 flex items-center justify-center gap-1.5 text-[11px] text-slate-400 font-medium border-t border-slate-100">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i>
            <span>Cash on Delivery & Secure Checkout</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="mobileCartBar" class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 p-3 shadow-xl hidden">
    <div class="flex items-center justify-between gap-4">
      <div>
        <span class="text-[10px] text-slate-400 font-semibold block uppercase">Total Payable</span>
        <span id="mobileTotalPrice" class="text-base font-black font-mono text-slate-900">BDT 0</span>
      </div>
      <button onclick="proceedToCheckout()" class="flex-1 bg-slate-900 hover:bg-black text-white py-3.5 px-6 rounded-xl font-bold text-xs transition active:scale-95 flex items-center justify-center gap-2">
        <span>Proceed to Checkout</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const currentShop = urlParams.get('shop') || 'lowbudget';
    const CART_STORAGE_KEY = `cart_${currentShop}`;
    const STORE_CACHE_NAME = `store_name_${currentShop}`;
    const STORE_CACHE_LOGO = `store_logo_${currentShop}`;

    const homeShopUrl = `store.html?shop=${encodeURIComponent(currentShop)}`;
    const brandLink = document.getElementById('cartBrandLink');
    if (brandLink) brandLink.href = homeShopUrl;

    function handleBackNavigation() {
      if (document.referrer && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = homeShopUrl;
      }
    }

    const cachedName = localStorage.getItem(STORE_CACHE_NAME);
    const cachedLogo = localStorage.getItem(STORE_CACHE_LOGO);

    if (cachedName) {
      document.title = `Shopping Bag | ${cachedName}`;
      document.getElementById('cartStoreTitle').innerText = cachedName;
    }
    if (cachedLogo) {
      const img = document.getElementById('cartHeaderLogo');
      const fallback = document.getElementById('cartLogoFallback');
      img.src = cachedLogo;
      img.classList.remove('hidden');
      fallback.classList.add('hidden');
      document.getElementById('pageFavicon').href = cachedLogo;
    }

    const firebaseConfig = {
      apiKey: "AIzaSyD2txpRBwRAtKisXlsslm2BosSJ3rxrXQg",
      authDomain: "tiodisk-d97c1.firebaseapp.com",
      databaseURL: "https://tiodisk-d97c1-default-rtdb.firebaseio.com",
      projectId: "tiodisk-d97c1",
      storageBucket: "tiodisk-d97c1.firebasestorage.app",
      messagingSenderId: "874244971549",
      appId: "1:874244971549:web:7bf9532a6b6dcb1f8bbaf4",
      measurementId: "G-3ZQWMQ2G8B"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref(`stores/${currentShop}/settings`).on('value', snap => {
      const s = snap.val();
      if (!s) return;

      if (s.storeName) {
        document.title = `Shopping Bag | ${s.storeName}`;
        document.getElementById('cartStoreTitle').innerText = s.storeName;
        localStorage.setItem(STORE_CACHE_NAME, s.storeName);
      }

      if (s.logo) {
        const img = document.getElementById('cartHeaderLogo');
        const fallback = document.getElementById('cartLogoFallback');
        img.src = s.logo;
        img.classList.remove('hidden');
        fallback.classList.add('hidden');
        document.getElementById('pageFavicon').href = s.logo;
        localStorage.setItem(STORE_CACHE_LOGO, s.logo);
      }
    });

    let cart = [];

    function loadCart() {
      cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '[]');
      renderCart();

      if (cart.length > 0) {
        db.ref(`stores/${currentShop}/products`).once('value').then(snap => {
          const prods = snap.val() || {};
          let hasUpdates = false;

          cart.forEach(item => {
            if (!item.isCombo && item.id && prods[item.id]) {
              const p = prods[item.id];
              item.availableSizes = p.sizes || [];
              item.availableColors = p.colors || [];
              item.colorImages = p.colorImages || {};
              item.sizeStock = p.sizeStock || {};
              item.stock = p.stock || 0;
              hasUpdates = true;
            }
          });

          if (hasUpdates) {
            localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
            renderCart();
          }
        }).catch(() => {});
      }
    }

    function renderCart() {
      const emptyState = document.getElementById('cartEmptyState');
      const content = document.getElementById('cartContent');
      const list = document.getElementById('cartItemsList');
      const headerCount = document.getElementById('cartCountHeader');
      const summaryItems = document.getElementById('summaryTotalItems');
      const clearBtn = document.getElementById('clearCartBtn');
      const mobBar = document.getElementById('mobileCartBar');

      const totalItems = cart.reduce((acc, it) => acc + (Number(it.quantity) || 1), 0);
      if (headerCount) headerCount.innerText = totalItems;
      if (summaryItems) summaryItems.innerText = `${totalItems} items`;

      if (cart.length === 0) {
        emptyState.classList.remove('hidden');
        content.classList.add('hidden');
        if (clearBtn) clearBtn.classList.add('hidden');
        if (mobBar) mobBar.classList.add('hidden');
        if (window.lucide) lucide.createIcons();
        return;
      }

      emptyState.classList.add('hidden');
      content.classList.remove('hidden');
      if (clearBtn) clearBtn.classList.remove('hidden');
      if (mobBar) mobBar.classList.remove('hidden');
      list.innerHTML = '';

      let subtotal = 0;
      let allItemsFreeDelivery = cart.length > 0 && cart.every(it => it.isFreeDelivery);

      cart.forEach((item, index) => {
        const itemPrice = Number(item.price) || 0;
        const itemQty = Number(item.quantity) || 1;
        subtotal += itemPrice * itemQty;

        const card = document.createElement('div');
        card.className = "bg-white p-4 sm:p-5 rounded-3xl border border-slate-200/90 shadow-xs space-y-3";

        if (item.isCombo) {
          const bundleList = item.bundleItems || item.bundledProducts || [];
          const bundleDetails = bundleList.map(b => `
            <div class="flex items-center gap-3 bg-slate-50 p-2.5 rounded-xl border border-slate-200/70">
              <img src="${b.imageUrl || ''}" alt="${b.name}" class="w-10 h-10 rounded-lg object-cover bg-white border border-slate-200 shrink-0">
              <div class="min-w-0 flex-1">
                <span class="text-xs font-bold text-slate-900 block truncate">${b.name}</span>
                <span class="text-[10px] text-slate-500 font-semibold block">${b.selectedSize ? 'Size: ' + b.selectedSize : ''}${b.selectedColor ? ' · Color: ' + b.selectedColor : ''}</span>
              </div>
            </div>
          `).join('');

          card.innerHTML = `
            <div class="flex items-start justify-between gap-3 border-b border-slate-100 pb-3">
              <div class="min-w-0">
                <span class="inline-block bg-slate-900 text-white text-[9px] font-black uppercase px-2 py-0.5 rounded-md mb-1">Bundle Deal</span>
                <h3 class="text-sm font-extrabold text-slate-900 truncate">${item.name}</h3>
              </div>
              <button onclick="removeItem(${index})" class="text-slate-300 hover:text-rose-600 transition p-1">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="space-y-2">
              ${bundleDetails}
            </div>

            <div class="flex items-center justify-between pt-3 border-t border-slate-100">
              <div class="flex items-center border border-slate-200 rounded-xl overflow-hidden bg-slate-50">
                <button onclick="changeQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-slate-600 hover:bg-slate-200 transition active:scale-95">-</button>
                <span class="w-8 text-center text-xs font-mono font-bold text-slate-900 bg-white py-1.5">${itemQty}</span>
                <button onclick="changeQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-slate-600 hover:bg-slate-200 transition active:scale-95">+</button>
              </div>
              <span class="text-sm font-black font-mono text-slate-900">BDT ${itemPrice * itemQty}</span>
            </div>
          `;
        } else {
          let sizeSelectHtml = '';
          if (item.availableSizes && item.availableSizes.length > 0) {
            sizeSelectHtml = `
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Size:</span>
                <select onchange="updateCartItemSize(${index}, this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 outline-none font-bold text-slate-800 cursor-pointer">
                  ${item.availableSizes.map(s => {
                    const sVal = typeof s === 'object' ? s.size : s;
                    const szStock = (item.sizeStock && typeof item.sizeStock === 'object' && item.sizeStock[sVal] !== undefined) ? Number(item.sizeStock[sVal]) : null;
                    const isOut = szStock !== null && szStock <= 0;
                    return `<option value="${sVal}" ${sVal === item.selectedSize ? 'selected' : ''} ${isOut ? 'disabled' : ''}>${sVal} ${isOut ? '(Stock Out)' : ''}</option>`;
                  }).join('')}
                </select>
              </div>
            `;
          } else if (item.selectedSize) {
            sizeSelectHtml = `<span class="text-[10px] font-bold text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-md">Size: ${item.selectedSize}</span>`;
          }

          let colorSelectHtml = '';
          if (item.availableColors && item.availableColors.length > 0) {
            colorSelectHtml = `
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Color:</span>
                <select onchange="updateCartItemColor(${index}, this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 outline-none font-bold text-slate-800 cursor-pointer">
                  ${item.availableColors.map(c => `<option value="${c}" ${c === item.selectedColor ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
              </div>
            `;
          } else if (item.selectedColor) {
            colorSelectHtml = `<span class="text-[10px] font-bold text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-md">Color: ${item.selectedColor}</span>`;
          }

          card.innerHTML = `
            <div class="flex gap-3.5 items-start">
              <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-slate-50 border border-slate-200 overflow-hidden shrink-0 flex items-center justify-center p-1">
                <img src="${item.imageUrl || ''}" alt="${item.name}" class="w-full h-full object-contain">
              </div>

              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <h3 class="text-xs sm:text-sm font-extrabold text-slate-900 truncate">${item.name}</h3>
                  <button onclick="removeItem(${index})" class="text-slate-300 hover:text-rose-600 transition p-0.5">
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>
                </div>

                <div class="flex items-baseline gap-2 mt-1">
                  <span class="text-xs sm:text-sm font-black font-mono text-slate-900">BDT ${itemPrice}</span>
                  ${item.regularPrice && Number(item.regularPrice) > itemPrice ? `<span class="text-[10px] text-slate-400 line-through font-mono">BDT ${item.regularPrice}</span>` : ''}
                  ${item.isFreeDelivery ? `<span class="text-[9px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">Free Del</span>` : ''}
                </div>

                <div class="flex flex-wrap items-center gap-2 mt-2">
                  ${sizeSelectHtml}
                  ${colorSelectHtml}
                </div>
              </div>
            </div>

            <div class="flex items-center justify-between pt-3 border-t border-slate-100">
              <div class="flex items-center border border-slate-200 rounded-xl overflow-hidden bg-slate-50">
                <button onclick="changeQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-slate-600 hover:bg-slate-200 transition active:scale-95">-</button>
                <span class="w-8 text-center text-xs font-mono font-bold text-slate-900 bg-white py-1.5">${itemQty}</span>
                <button onclick="changeQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-slate-600 hover:bg-slate-200 transition active:scale-95">+</button>
              </div>
              <span class="text-xs sm:text-sm font-black font-mono text-slate-900">BDT ${itemPrice * itemQty}</span>
            </div>
          `;
        }

        list.appendChild(card);
      });

      document.getElementById('subtotalPrice').innerText = `BDT ${subtotal}`;
      document.getElementById('grandTotalPrice').innerText = `BDT ${subtotal}`;
      const mobTotal = document.getElementById('mobileTotalPrice');
      if (mobTotal) mobTotal.innerText = `BDT ${subtotal}`;

      const freeDelBanner = document.getElementById('freeDeliveryNoticeWrap');
      const delNotice = document.getElementById('deliveryFeeNotice');
      if (allItemsFreeDelivery) {
        freeDelBanner.classList.remove('hidden');
        delNotice.innerHTML = `<span class="text-emerald-600 font-bold">Free</span>`;
      } else {
        freeDelBanner.classList.add('hidden');
        delNotice.innerText = `Calculated at Checkout`;
      }

      if (window.lucide) lucide.createIcons();
    }

    function updateCartItemSize(index, newSize) {
      if (!cart[index]) return;
      const item = cart[index];

      if (item.sizeStock && typeof item.sizeStock === 'object') {
        const availableStock = Number(item.sizeStock[newSize]) || 0;
        if (availableStock <= 0) {
          Swal.fire({ icon: 'warning', title: 'স্টক নেই', text: `'${newSize}' সাইজটি বর্তমানে আউট অব স্টক!` });
          renderCart();
          return;
        }

        if (Number(item.quantity) > availableStock) {
          item.quantity = availableStock;
          Swal.fire({ icon: 'info', title: 'স্টক সামঞ্জস্য', text: `এই সাইজের সর্বোচ্চ ${availableStock} টি স্টক আছে।` });
        }
      }

      item.selectedSize = newSize;
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function updateCartItemColor(index, newColor) {
      if (!cart[index]) return;
      const item = cart[index];
      item.selectedColor = newColor;

      if (item.colorImages && item.colorImages[newColor] && item.colorImages[newColor][0]) {
        item.imageUrl = item.colorImages[newColor][0];
      }

      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function changeQty(index, delta) {
      const item = cart[index];
      let maxStock = 999;

      if (!item.isCombo && item.sizeStock && item.selectedSize && typeof item.sizeStock === 'object') {
        maxStock = Number(item.sizeStock[item.selectedSize]) || 0;
      } else if (!item.isCombo && item.stock !== undefined) {
        maxStock = Number(item.stock) || 0;
      }

      const currentQty = Number(item.quantity) || 1;

      if (delta > 0 && currentQty >= maxStock) {
        Swal.fire({ icon: 'warning', title: 'সর্বোচ্চ স্টক', text: `এই আইটেমের সর্বোচ্চ ${maxStock} টি স্টক আছে।` });
        return;
      }

      item.quantity = currentQty + delta;
      if (item.quantity <= 0) {
        cart.splice(index, 1);
      }
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      Swal.fire({
        title: 'ব্যাগ খালি করতে চান?',
        text: 'আপনার ব্যাগের সব পণ্য মুছে যাবে!',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#0f172a',
        cancelButtonColor: '#e2e8f0',
        confirmButtonText: 'হ্যাঁ, খালি করুন',
        cancelButtonText: 'বাতিল'
      }).then((result) => {
        if (result.isConfirmed) {
          cart = [];
          localStorage.removeItem(CART_STORAGE_KEY);
          renderCart();
        }
      });
    }

    function proceedToCheckout() {
      if (cart.length === 0) return;
      window.location.href = `checkout.html?fromCart=true&shop=${encodeURIComponent(currentShop)}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      loadCart();
    });
  </script>
</body>
</html>
