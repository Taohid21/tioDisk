<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="cartPageTitle">Shopping Cart | Online Store</title>
  
  <!-- Favicon -->
  <link id="pageFavicon" rel="icon" type="image/jpeg" href="https://i.postimg.cc/Y28MDVJr/FB-IMG-1788689035157.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #fcfcfc;
      color: #0f172a;
    }
  </style>
</head>
<body class="antialiased selection:bg-black selection:text-white min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white/95 backdrop-blur-md border-b border-gray-100 sticky top-0 z-30 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Back Button & Logo -->
      <div class="flex items-center gap-3">
        <button onclick="handleBackNavigation()" class="w-9 h-9 rounded-xl border border-gray-200 bg-white flex items-center justify-center text-black hover:bg-gray-100 transition active:scale-95 shadow-sm" title="Go Back">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>
        <div class="flex items-center gap-2.5">
          <img id="cartHeaderLogo" src="https://i.postimg.cc/Y28MDVJr/FB-IMG-1788689035157.jpg" alt="Logo" class="w-8 h-8 rounded-xl object-cover border border-gray-100">
          <div>
            <h1 class="text-sm sm:text-base font-extrabold text-black flex items-center gap-1.5">
              <span id="cartStoreTitle">Shopping Cart</span>
              <span class="text-xs px-2 py-0.5 bg-gray-100 text-gray-700 rounded-full font-bold" id="cartCountHeader">0</span>
            </h1>
          </div>
        </div>
      </div>

      <!-- Action -->
      <button onclick="clearCart()" class="text-xs font-semibold text-gray-500 hover:text-red-600 transition flex items-center gap-1">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Clear All</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full">
    
    <!-- Empty Cart State -->
    <div id="cartEmptyState" class="hidden text-center py-20 bg-white rounded-3xl border border-gray-100 p-8 shadow-sm max-w-lg mx-auto mt-6">
      <div class="w-16 h-16 bg-gray-50 text-gray-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-gray-100">
        <i data-lucide="shopping-bag" class="w-8 h-8"></i>
      </div>
      <h3 class="text-lg font-bold text-black mb-1">Your cart is currently empty</h3>
      <p class="text-xs text-gray-500 mb-6 max-w-xs mx-auto">Looks like you haven't added any products yet. Browse our store to find your essentials.</p>
      <button onclick="handleBackNavigation()" class="inline-flex items-center gap-2 bg-black hover:bg-neutral-800 text-white px-6 py-3 rounded-xl text-xs font-semibold transition shadow-md active:scale-95">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Continue Shopping</span>
      </button>
    </div>

    <!-- Active Cart: Responsive 2-Column on Desktop (PC) & Clean Stack on Mobile -->
    <div id="cartContent" class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
      
      <!-- Left Column: Products List (lg: 8 Cols) -->
      <div class="lg:col-span-7 xl:col-span-8 space-y-3" id="cartItemsList">
        <!-- Dynamic Cart Items Rendered Here -->
      </div>

      <!-- Right Column: Order Summary & Checkout Card (lg: 4 Cols Sticky) -->
      <div class="lg:col-span-5 xl:col-span-4 sticky top-24">
        <div class="bg-white p-5 sm:p-6 rounded-3xl border border-gray-100 shadow-sm space-y-4">
          
          <h2 class="text-sm font-bold uppercase tracking-wider text-gray-900 border-b border-gray-100 pb-3">Order Summary</h2>

          <div class="space-y-2.5 text-xs sm:text-sm">
            <div class="flex justify-between text-gray-600">
              <span>Subtotal (<span id="summaryTotalItems">0</span> items)</span>
              <span class="font-bold text-black" id="subtotalPrice">BDT 0</span>
            </div>
            
            <div class="flex justify-between text-gray-600">
              <span>Delivery Fee</span>
              <span class="text-emerald-600 font-semibold" id="deliveryFeeNotice">Calculated at Checkout</span>
            </div>
          </div>

          <div class="border-t border-gray-100 pt-3 flex justify-between items-baseline text-base font-extrabold text-black">
            <span>Total Amount</span>
            <span class="text-lg sm:text-xl text-black" id="grandTotalPrice">BDT 0</span>
          </div>

          <button onclick="proceedToCheckout()" class="w-full bg-black hover:bg-neutral-800 text-white py-3.5 rounded-xl font-bold text-xs sm:text-sm tracking-wide transition active:scale-[0.99] shadow-md flex items-center justify-center gap-2">
            <span>Proceed to Checkout</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>

          <button onclick="handleBackNavigation()" class="w-full bg-gray-50 hover:bg-gray-100 text-gray-700 py-2.5 rounded-xl font-semibold text-xs transition active:scale-[0.99] flex items-center justify-center gap-1.5 border border-gray-200">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Continue Shopping</span>
          </button>

          <!-- Safe Checkout Badge -->
          <div class="pt-2 flex items-center justify-center gap-2 text-[11px] text-gray-400 font-medium">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
            <span>100% Secure Checkout Guaranteed</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    let LOGO_PLACEHOLDER = "https://i.postimg.cc/Y28MDVJr/FB-IMG-1788689035157.jpg";

    // 1. DYNAMIC SHOP RESOLVER
    const urlParams = new URLSearchParams(window.location.search);
    const currentShop = urlParams.get('shop') || 'lowbudget';
    const CART_STORAGE_KEY = `cart_${currentShop}`;

    // 2. SMART BACK NAVIGATION
    // আগে যে ফাইলে ছিল ঠিক সেখানে যাবে, ইতিহাস না থাকলে শপের index.html পেজে যাবে
    function handleBackNavigation() {
      if (document.referrer && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = `index.html?shop=${encodeURIComponent(currentShop)}`;
      }
    }

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
      authDomain: "new-all-f99f7.firebaseapp.com",
      databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
      projectId: "new-all-f99f7",
      storageBucket: "new-all-f99f7.firebasestorage.app",
      messagingSenderId: "1069748173900",
      appId: "1:1069748173900:web:158d6336c0f4628133c8e9"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Load Settings
    db.ref(`stores/${currentShop}/settings`).on('value', snap => {
      const s = snap.val();
      if (!s) return;

      const storeName = s.storeName || 'Online Store';
      document.title = `Shopping Cart | ${storeName}`;
      document.getElementById('cartStoreTitle').innerText = `${storeName} Cart`;

      if (s.logo) {
        LOGO_PLACEHOLDER = s.logo;
        document.getElementById('cartHeaderLogo').src = s.logo;
        document.getElementById('pageFavicon').href = s.logo;
      }
    });

    let cart = [];

    function loadCart() {
      cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '[]');
      renderCart();
    }

    function renderCart() {
      const emptyState = document.getElementById('cartEmptyState');
      const content = document.getElementById('cartContent');
      const list = document.getElementById('cartItemsList');
      const headerCount = document.getElementById('cartCountHeader');
      const summaryItems = document.getElementById('summaryTotalItems');

      const totalItems = cart.reduce((acc, it) => acc + (it.quantity || 1), 0);
      headerCount.innerText = totalItems;
      if (summaryItems) summaryItems.innerText = totalItems;

      if (cart.length === 0) {
        emptyState.classList.remove('hidden');
        content.classList.add('hidden');
        lucide.createIcons();
        return;
      }

      emptyState.classList.add('hidden');
      content.classList.remove('hidden');
      list.innerHTML = '';

      let subtotal = 0;

      cart.forEach((item, index) => {
        const itemPrice = Number(item.price) || 0;
        const itemQty = Number(item.quantity) || 1;
        subtotal += itemPrice * itemQty;

        const el = document.createElement('div');
        el.className = "bg-white p-4 sm:p-5 rounded-3xl border border-gray-100 flex gap-4 items-center shadow-sm hover:border-gray-200 transition";

        // Size Selector
        let sizeSelect = '';
        if (item.sizes && item.sizes.length > 0) {
          sizeSelect = `
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] text-gray-500 font-medium">Size:</span>
              <select onchange="updateVariant(${index}, 'selectedSize', this.value)" class="text-xs bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 outline-none font-semibold cursor-pointer">
                ${item.sizes.map(s => {
                  const val = typeof s === 'object' ? s.size : s;
                  return `<option value="${val}" ${val === item.selectedSize ? 'selected' : ''}>${val}</option>`;
                }).join('')}
              </select>
            </div>
          `;
        }

        // Color Selector
        let colorSelect = '';
        if (item.colors && item.colors.length > 0) {
          colorSelect = `
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] text-gray-500 font-medium">Color:</span>
              <select onchange="updateVariant(${index}, 'selectedColor', this.value)" class="text-xs bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 outline-none font-semibold cursor-pointer">
                ${item.colors.map(c => `<option value="${c}" ${c === item.selectedColor ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </div>
          `;
        }

        el.innerHTML = `
          <img 
            src="${item.imageUrl || LOGO_PLACEHOLDER}" 
            alt="${item.name}" 
            class="w-20 h-24 sm:w-24 sm:h-28 object-cover rounded-2xl border border-gray-100 bg-gray-50 shrink-0"
            onerror="this.src='${LOGO_PLACEHOLDER}'"
          >
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start gap-2">
              <h4 class="text-xs sm:text-sm font-bold text-gray-900 line-clamp-1">${item.name}</h4>
              <button onclick="removeItem(${index})" class="text-gray-400 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-50 transition shrink-0" title="Remove Item">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
            
            <div class="flex items-baseline gap-2 mt-1">
              <span class="text-xs sm:text-sm font-extrabold text-black">BDT ${itemPrice}</span>
              ${item.regularPrice && item.regularPrice > itemPrice ? `<span class="text-[11px] text-gray-400 line-through">BDT ${item.regularPrice}</span>` : ''}
            </div>
            
            <div class="flex flex-wrap items-center gap-3 mt-2">
              ${sizeSelect}
              ${colorSelect}
            </div>

            <div class="flex items-center gap-3 mt-3">
              <div class="flex items-center border border-gray-200 rounded-xl bg-gray-50 overflow-hidden">
                <button onclick="changeQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-gray-600 hover:bg-gray-200 transition active:scale-95">-</button>
                <span class="text-xs font-bold w-7 text-center select-none text-black">${itemQty}</span>
                <button onclick="changeQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-gray-600 hover:bg-gray-200 transition active:scale-95">+</button>
              </div>
              <span class="text-xs text-gray-400 font-medium">Sub: BDT ${itemPrice * itemQty}</span>
            </div>
          </div>
        `;
        list.appendChild(el);
      });

      document.getElementById('subtotalPrice').innerText = `BDT ${subtotal}`;
      document.getElementById('grandTotalPrice').innerText = `BDT ${subtotal}`;
      lucide.createIcons();
    }

    function changeQty(index, delta) {
      cart[index].quantity += delta;
      if (cart[index].quantity <= 0) {
        if (confirm('Do you want to remove this product from the cart?')) {
          cart.splice(index, 1);
        } else {
          cart[index].quantity = 1;
        }
      }
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function updateVariant(index, key, val) {
      cart[index][key] = val;
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      if (confirm('Are you sure you want to clear your entire cart?')) {
        cart = [];
        localStorage.removeItem(CART_STORAGE_KEY);
        renderCart();
      }
    }

    function proceedToCheckout() {
      if (cart.length === 0) return;
      window.location.href = `checkout.html?fromCart=true&shop=${encodeURIComponent(currentShop)}`;
    }

    // Initialize instantly
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadCart();
    });
  </script>
</body>
</html>
