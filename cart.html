<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="cartPageTitle">Style Forever | Shopping Bag</title>
  
  <link id="pageFavicon" rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg">
  
  <!-- Fast Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Animated Luxury Popups (SweetAlert2) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Space Grotesk"', 'monospace']
          },
          colors: {
            brand: {
              DEFAULT: '#008F7A',
              dark: '#005C4F',
              night: '#061B18',
              soft: '#EFF8F6',
              light: '#DDF3EE',
              border: '#D7E8E4'
            }
          }
        }
      }
    }
  </script>

  <style>
    body { 
      background-color: #FAF8F5;
      color: #10201D;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Shimmer Skeleton */
    .skeleton-box {
      background: #EFF8F6;
      position: relative;
      overflow: hidden;
    }
    .skeleton-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-[#008F7A] selection:text-white pb-24 md:pb-12">

  <!-- ==================== HEADER ==================== -->
  <header class="bg-white/90 backdrop-blur-md border-b border-[#D7E8E4] sticky top-0 z-40 transition-all">
    <div class="max-w-6xl mx-auto px-4 sm:px-8 h-16 sm:h-20 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <button onclick="handleBackNavigation()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl border border-[#D7E8E4] bg-white flex items-center justify-center text-[#10201D] hover:bg-[#EFF8F6] transition active:scale-95 shadow-sm" aria-label="Go Back">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>
        
        <a id="cartBrandLink" href="index.html" class="flex items-center gap-2.5">
          <img id="cartHeaderLogo" src="https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg" alt="Logo" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl object-cover border border-[#D7E8E4] bg-white">
          <div class="flex items-center gap-2">
            <span id="cartStoreTitle" class="font-extrabold text-base sm:text-lg tracking-tight text-[#10201D] truncate max-w-[150px] sm:max-w-xs">Style Forever</span>
            <span id="cartCountHeader" class="text-xs font-mono font-bold bg-[#008F7A] text-white px-2 py-0.5 rounded-full">0</span>
          </div>
        </a>
      </div>

      <button id="clearCartBtn" onclick="clearCart()" class="text-xs font-bold text-zinc-400 hover:text-rose-600 transition flex items-center gap-1.5 px-3 py-1.5 rounded-xl hover:bg-rose-50">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Empty Bag</span>
      </button>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="max-w-6xl mx-auto px-4 sm:px-8 py-6 sm:py-10 flex-1 w-full">
    
    <!-- Shimmer Skeleton Preloader -->
    <div id="cartSkeleton" class="space-y-4">
      <div class="skeleton-box h-24 rounded-3xl border border-[#D7E8E4]"></div>
      <div class="skeleton-box h-24 rounded-3xl border border-[#D7E8E4]"></div>
      <div class="skeleton-box h-40 rounded-3xl border border-[#D7E8E4]"></div>
    </div>

    <!-- Empty State -->
    <div id="cartEmptyState" class="hidden text-center py-16 bg-white rounded-3xl border border-[#D7E8E4] p-8 shadow-sm max-w-sm mx-auto mt-6">
      <div class="w-16 h-16 bg-[#EFF8F6] text-[#008F7A] rounded-2xl flex items-center justify-center mx-auto mb-4 border border-[#D7E8E4]">
        <i data-lucide="shopping-bag" class="w-8 h-8"></i>
      </div>
      <h3 class="text-base font-extrabold text-[#10201D] mb-1">আপনার ব্যাগ খালি</h3>
      <p class="text-xs text-zinc-400 mb-6 font-medium leading-relaxed">Your shopping bag is currently empty.</p>
      <button onclick="handleBackNavigation()" class="inline-flex items-center justify-center gap-2 w-full bg-[#008F7A] hover:bg-[#005C4F] text-white px-6 py-3.5 rounded-2xl text-xs font-bold transition shadow-sm active:scale-95">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Start Shopping</span>
      </button>
    </div>

    <!-- Filled Bag Grid -->
    <div id="cartContent" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-10 items-start">
      
      <!-- Cart Items List -->
      <div class="lg:col-span-7 xl:col-span-8 space-y-3.5" id="cartItemsList"></div>

      <!-- Order Summary Card -->
      <div class="lg:col-span-5 xl:col-span-4 sticky top-24">
        <div class="bg-white p-6 sm:p-7 rounded-3xl border border-[#D7E8E4] shadow-sm space-y-4">
          
          <div class="flex items-center justify-between border-b border-zinc-100 pb-3">
            <h2 class="text-xs font-extrabold uppercase tracking-wider text-[#008F7A]">অর্ডার বিবরণী</h2>
            <span class="text-xs font-mono font-bold text-zinc-400" id="summaryTotalItems">0 items</span>
          </div>

          <div class="space-y-2.5 text-xs sm:text-sm">
            <div class="flex justify-between text-zinc-600">
              <span>Items Total:</span>
              <span class="font-bold text-[#10201D] font-mono" id="subtotalPrice">৳ 0</span>
            </div>
            
            <div class="flex justify-between text-zinc-600 items-center">
              <span>Shipping Fee:</span>
              <span class="text-xs font-semibold text-zinc-400" id="deliveryFeeNotice">Calculated at Checkout</span>
            </div>

            <div id="freeDeliveryNoticeWrap" class="hidden bg-[#EFF8F6] border border-[#D7E8E4] p-2.5 rounded-2xl text-[#008F7A] text-xs font-bold flex items-center gap-2">
              <i data-lucide="sparkles" class="w-4 h-4 shrink-0"></i>
              <span>Free Delivery included in this order</span>
            </div>
          </div>

          <div class="border-t border-zinc-100 pt-3.5 flex justify-between items-baseline">
            <span class="text-xs font-bold uppercase tracking-wider text-zinc-700">Subtotal Payable</span>
            <span class="text-xl sm:text-2xl font-black text-[#008F7A] font-mono" id="grandTotalPrice">৳ 0</span>
          </div>

          <button onclick="proceedToCheckout()" class="w-full bg-[#008F7A] hover:bg-[#005C4F] text-white py-4 rounded-2xl font-bold text-xs sm:text-sm tracking-wide transition active:scale-[0.99] shadow-sm flex items-center justify-center gap-2">
            <span>Proceed to Checkout</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>

          <button onclick="handleBackNavigation()" class="w-full bg-[#EFF8F6] hover:bg-[#DDF3EE] text-[#10201D] py-3 rounded-2xl font-bold text-xs transition flex items-center justify-center gap-1.5 border border-[#D7E8E4]">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Continue Shopping</span>
          </button>

          <div class="pt-2 flex items-center justify-center gap-1.5 text-[11px] text-zinc-400 font-medium border-t border-zinc-100">
            <i data-lucide="shield-check" class="w-4 h-4 text-[#008F7A]"></i>
            <span>Cash on Delivery & 100% Quality Assured</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Mobile Bottom Sticky Checkout Bar -->
  <div id="mobileCartBar" class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-[#D7E8E4] p-3 shadow-xl hidden">
    <div class="flex items-center justify-between gap-4">
      <div>
        <span class="text-[10px] text-zinc-400 font-semibold block uppercase">Total Payable</span>
        <span id="mobileTotalPrice" class="text-base font-black font-mono text-[#008F7A]">৳ 0</span>
      </div>
      <button onclick="proceedToCheckout()" class="flex-1 bg-[#008F7A] hover:bg-[#005C4F] text-white py-3.5 px-6 rounded-2xl font-bold text-xs transition active:scale-95 flex items-center justify-center gap-2 shadow-sm">
        <span>Proceed to Checkout</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <script>
    let LOGO_PLACEHOLDER = "https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg";

    const urlParams = new URLSearchParams(window.location.search);
    const currentShop = urlParams.get('shop') || 'styleforever';
    const CART_STORAGE_KEY = `cart_${currentShop}`;
    const STORE_CACHE_NAME = `store_name_${currentShop}`;
    const STORE_CACHE_LOGO = `store_logo_${currentShop}`;

    const homeShopUrl = `index.html?shop=${encodeURIComponent(currentShop)}`;
    const brandLink = document.getElementById('cartBrandLink');
    if (brandLink) brandLink.href = homeShopUrl;

    function handleBackNavigation() {
      if (document.referrer && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = homeShopUrl;
      }
    }

    // Instant local cache load
    const cachedName = localStorage.getItem(STORE_CACHE_NAME);
    const cachedLogo = localStorage.getItem(STORE_CACHE_LOGO);

    if (cachedName) {
      document.title = `${cachedName} | Shopping Bag`;
      document.getElementById('cartStoreTitle').innerText = cachedName;
    }
    if (cachedLogo) {
      document.getElementById('cartHeaderLogo').src = cachedLogo;
      document.getElementById('pageFavicon').href = cachedLogo;
    }

    const firebaseConfig = {
      apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
      authDomain: "new-all-f99f7.firebaseapp.com",
      databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
      projectId: "new-all-f99f7",
      storageBucket: "new-all-f99f7.firebasestorage.app",
      messagingSenderId: "1069748173900",
      appId: "1:1069748173900:web:158d6336c0f4628133c8e9"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref(`stores/${currentShop}/settings`).on('value', snap => {
      const s = snap.val();
      if (!s) return;

      const storeName = s.storeName || 'Style Forever';
      document.title = `${storeName} | Shopping Bag`;
      document.getElementById('cartStoreTitle').innerText = storeName;
      localStorage.setItem(STORE_CACHE_NAME, storeName);

      if (s.logo) {
        LOGO_PLACEHOLDER = s.logo;
        document.getElementById('cartHeaderLogo').src = s.logo;
        document.getElementById('pageFavicon').href = s.logo;
        localStorage.setItem(STORE_CACHE_LOGO, s.logo);
      }
    });

    let cart = [];

    function loadCart() {
      cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '[]');
      
      const skeleton = document.getElementById('cartSkeleton');
      if (skeleton) skeleton.style.display = 'none';
      renderCart();

      // ব্যাকগ্রাউন্ডে সাইজ ও স্টকের তথ্য আপডেট
      if (cart.length > 0) {
        db.ref(`stores/${currentShop}/products`).once('value').then(snap => {
          const prods = snap.val() || {};
          let hasUpdates = false;

          cart.forEach(item => {
            if (!item.isCombo && item.id && prods[item.id]) {
              const p = prods[item.id];
              if (p.sizes && (!item.availableSizes || item.availableSizes.length === 0)) {
                item.availableSizes = p.sizes;
                hasUpdates = true;
              }
              if (p.colors && (!item.availableColors || item.availableColors.length === 0)) {
                item.availableColors = p.colors;
                hasUpdates = true;
              }
              if (p.colorImages) item.colorImages = p.colorImages;
              if (p.sizeStock) item.sizeStock = p.sizeStock;
              if (p.stock !== undefined) item.stock = p.stock;
            }
          });

          if (hasUpdates) {
            localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
            renderCart();
          }
        }).catch(() => {});
      }
    }

    function renderCart() {
      const emptyState = document.getElementById('cartEmptyState');
      const content = document.getElementById('cartContent');
      const list = document.getElementById('cartItemsList');
      const headerCount = document.getElementById('cartCountHeader');
      const summaryItems = document.getElementById('summaryTotalItems');
      const clearBtn = document.getElementById('clearCartBtn');
      const mobBar = document.getElementById('mobileCartBar');

      const totalItems = cart.reduce((acc, it) => acc + (Number(it.quantity) || 1), 0);
      if (headerCount) headerCount.innerText = totalItems;
      if (summaryItems) summaryItems.innerText = `${totalItems} item${totalItems === 1 ? '' : 's'}`;

      if (cart.length === 0) {
        emptyState.classList.remove('hidden');
        content.classList.add('hidden');
        if (clearBtn) clearBtn.classList.add('hidden');
        if (mobBar) mobBar.classList.add('hidden');
        if (window.lucide) lucide.createIcons();
        return;
      }

      emptyState.classList.add('hidden');
      content.classList.remove('hidden');
      if (clearBtn) clearBtn.classList.remove('hidden');
      if (mobBar) mobBar.classList.remove('hidden');
      list.innerHTML = '';

      let subtotal = 0;
      let allItemsFreeDelivery = cart.length > 0 && cart.every(it => it.isFreeDelivery);

      cart.forEach((item, index) => {
        const itemPrice = Number(item.price) || 0;
        const itemQty = Number(item.quantity) || 1;
        subtotal += itemPrice * itemQty;

        const card = document.createElement('div');
        card.className = "bg-white p-4 sm:p-5 rounded-3xl border border-[#D7E8E4] shadow-sm space-y-3.5";

        if (item.isCombo) {
          // NEXFIT স্টাইল বান্ডেল ডিসপ্লে (প্রতিটি আইটেমের আলাদা ছবি ও স্পেক্স)
          const bundleList = item.bundleItems || item.bundledProducts || [];
          const bundleDetails = bundleList.map(b => `
            <div class="flex items-center gap-3 bg-[#EFF8F6] p-2.5 rounded-2xl border border-[#D7E8E4]">
              <img src="${b.imageUrl || LOGO_PLACEHOLDER}" alt="${b.name}" class="w-11 h-11 rounded-xl object-cover bg-white border border-[#D7E8E4] shrink-0" onerror="this.src='${LOGO_PLACEHOLDER}'">
              <div class="min-w-0 flex-1">
                <span class="text-xs font-bold text-[#10201D] block truncate">${b.name}</span>
                <span class="text-[10px] text-[#008F7A] font-bold block">${b.selectedSize ? 'Size: ' + b.selectedSize : ''}${b.selectedColor ? ' · Color: ' + b.selectedColor : ''}</span>
              </div>
            </div>
          `).join('');

          card.innerHTML = `
            <div class="flex items-start justify-between gap-3 border-b border-zinc-100 pb-3">
              <div class="min-w-0">
                <span class="inline-block bg-[#008F7A] text-white text-[9px] font-black uppercase px-2.5 py-0.5 rounded-full mb-1">Combo Bundle</span>
                <h3 class="text-sm font-extrabold text-[#10201D] truncate">${item.name}</h3>
              </div>
              <button onclick="removeItem(${index})" class="text-zinc-300 hover:text-rose-600 transition p-1">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="space-y-2">
              ${bundleDetails}
            </div>

            <div class="flex items-center justify-between pt-3 border-t border-zinc-100">
              <div class="flex items-center border border-[#D7E8E4] rounded-2xl overflow-hidden bg-[#EFF8F6]">
                <button onclick="changeQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-[#10201D] hover:bg-[#DDF3EE] transition active:scale-95">-</button>
                <span class="w-8 text-center text-xs font-mono font-bold text-[#10201D] bg-white py-1.5">${itemQty}</span>
                <button onclick="changeQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-[#10201D] hover:bg-[#DDF3EE] transition active:scale-95">+</button>
              </div>
              <span class="text-sm font-black font-mono text-[#008F7A]">৳ ${itemPrice * itemQty}</span>
            </div>
          `;
        } else {
          // সাধারণ প্রোডাক্ট
          let sizeSelectHtml = '';
          if (item.availableSizes && item.availableSizes.length > 0) {
            sizeSelectHtml = `
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold text-zinc-400 uppercase">Size:</span>
                <select onchange="updateCartItemSize(${index}, this.value)" class="text-xs bg-[#EFF8F6] border border-[#D7E8E4] rounded-xl px-2.5 py-1 outline-none font-bold text-[#10201D] cursor-pointer focus:border-[#008F7A]">
                  ${item.availableSizes.map(s => {
                    const sVal = typeof s === 'object' ? s.size : s;
                    const szStock = (item.sizeStock && typeof item.sizeStock === 'object' && item.sizeStock[sVal] !== undefined) ? Number(item.sizeStock[sVal]) : null;
                    const isOut = szStock !== null && szStock <= 0;
                    return `<option value="${sVal}" ${sVal === item.selectedSize ? 'selected' : ''} ${isOut ? 'disabled' : ''}>${sVal} ${isOut ? '(Out)' : ''}</option>`;
                  }).join('')}
                </select>
              </div>
            `;
          } else if (item.selectedSize) {
            sizeSelectHtml = `<span class="text-[10px] font-bold text-[#10201D] bg-[#EFF8F6] border border-[#D7E8E4] px-2 py-0.5 rounded-lg">Size: ${item.selectedSize}</span>`;
          }

          let colorSelectHtml = '';
          if (item.availableColors && item.availableColors.length > 0) {
            colorSelectHtml = `
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold text-zinc-400 uppercase">Color:</span>
                <select onchange="updateCartItemColor(${index}, this.value)" class="text-xs bg-[#EFF8F6] border border-[#D7E8E4] rounded-xl px-2.5 py-1 outline-none font-bold text-[#10201D] cursor-pointer focus:border-[#008F7A]">
                  ${item.availableColors.map(c => `<option value="${c}" ${c === item.selectedColor ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
              </div>
            `;
          } else if (item.selectedColor) {
            colorSelectHtml = `<span class="text-[10px] font-bold text-[#10201D] bg-[#EFF8F6] border border-[#D7E8E4] px-2 py-0.5 rounded-lg">Color: ${item.selectedColor}</span>`;
          }

          card.innerHTML = `
            <div class="flex gap-3.5 items-start">
              <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-[#EFF8F6] border border-[#D7E8E4] overflow-hidden shrink-0 flex items-center justify-center p-1">
                <img src="${item.imageUrl || LOGO_PLACEHOLDER}" alt="${item.name}" class="w-full h-full object-cover rounded-xl" onerror="this.src='${LOGO_PLACEHOLDER}'">
              </div>

              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <h3 class="text-xs sm:text-sm font-extrabold text-[#10201D] truncate">${item.name}</h3>
                  <button onclick="removeItem(${index})" class="text-zinc-300 hover:text-rose-600 transition p-0.5">
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>
                </div>

                <div class="flex items-baseline gap-2 mt-1">
                  <span class="text-xs sm:text-sm font-black font-mono text-[#008F7A]">৳ ${itemPrice}</span>
                  ${item.regularPrice && Number(item.regularPrice) > itemPrice ? `<span class="text-[10px] text-zinc-400 line-through font-mono">৳ ${item.regularPrice}</span>` : ''}
                  ${item.isFreeDelivery ? `<span class="text-[9px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">Free Del</span>` : ''}
                </div>

                <div class="flex flex-wrap items-center gap-2 mt-2">
                  ${sizeSelectHtml}
                  ${colorSelectHtml}
                </div>
              </div>
            </div>

            <div class="flex items-center justify-between pt-3 border-t border-zinc-100">
              <div class="flex items-center border border-[#D7E8E4] rounded-2xl overflow-hidden bg-[#EFF8F6]">
                <button onclick="changeQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-[#10201D] hover:bg-[#DDF3EE] transition active:scale-95">-</button>
                <span class="w-8 text-center text-xs font-mono font-bold text-[#10201D] bg-white py-1.5">${itemQty}</span>
                <button onclick="changeQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center font-bold text-sm text-[#10201D] hover:bg-[#DDF3EE] transition active:scale-95">+</button>
              </div>
              <span class="text-xs sm:text-sm font-black font-mono text-[#008F7A]">৳ ${itemPrice * itemQty}</span>
            </div>
          `;
        }

        list.appendChild(card);
      });

      document.getElementById('subtotalPrice').innerText = `৳ ${subtotal}`;
      document.getElementById('grandTotalPrice').innerText = `৳ ${subtotal}`;
      const mobTotal = document.getElementById('mobileTotalPrice');
      if (mobTotal) mobTotal.innerText = `৳ ${subtotal}`;

      const freeDelBanner = document.getElementById('freeDeliveryNoticeWrap');
      const delNotice = document.getElementById('deliveryFeeNotice');
      if (allItemsFreeDelivery) {
        freeDelBanner.classList.remove('hidden');
        delNotice.innerHTML = `<span class="text-[#008F7A] font-bold">Free</span>`;
      } else {
        freeDelBanner.classList.add('hidden');
        delNotice.innerText = `Calculated at Checkout`;
      }

      if (window.lucide) lucide.createIcons();
    }

    function updateCartItemSize(index, newSize) {
      if (!cart[index]) return;
      const item = cart[index];

      if (item.sizeStock && typeof item.sizeStock === 'object') {
        const availableStock = Number(item.sizeStock[newSize]) || 0;
        if (availableStock <= 0) {
          Swal.fire({ 
            icon: 'warning', 
            title: 'স্টক নেই', 
            text: `'${newSize}' সাইজটি বর্তমানে আউট অব স্টক!`,
            confirmButtonColor: '#008F7A'
          });
          renderCart();
          return;
        }

        if (Number(item.quantity) > availableStock) {
          item.quantity = availableStock;
          Swal.fire({ 
            icon: 'info', 
            title: 'স্টক সামঞ্জস্য', 
            text: `এই সাইজের সর্বোচ্চ ${availableStock} টি স্টক আছে।`,
            confirmButtonColor: '#008F7A'
          });
        }
      }

      item.selectedSize = newSize;
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function updateCartItemColor(index, newColor) {
      if (!cart[index]) return;
      const item = cart[index];
      item.selectedColor = newColor;

      if (item.colorImages && item.colorImages[newColor] && item.colorImages[newColor][0]) {
        item.imageUrl = item.colorImages[newColor][0];
      }

      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function changeQty(index, delta) {
      const item = cart[index];
      let maxStock = 999;

      if (!item.isCombo && item.sizeStock && item.selectedSize && typeof item.sizeStock === 'object') {
        maxStock = Number(item.sizeStock[item.selectedSize]) || 0;
      } else if (!item.isCombo && item.stock !== undefined) {
        maxStock = Number(item.stock) || 0;
      }

      const currentQty = Number(item.quantity) || 1;

      if (delta > 0 && currentQty >= maxStock) {
        Swal.fire({ 
          icon: 'warning', 
          title: 'সর্বোচ্চ স্টক', 
          text: `এই আইটেমের সর্বোচ্চ ${maxStock} টি স্টক আছে।`,
          confirmButtonColor: '#008F7A'
        });
        return;
      }

      item.quantity = currentQty + delta;
      if (item.quantity <= 0) {
        cart.splice(index, 1);
      }
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      Swal.fire({
        title: 'ব্যাগ খালি করতে চান?',
        text: 'আপনার ব্যাগের সব পণ্য মুছে যাবে!',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#008F7A',
        cancelButtonColor: '#e2e8f0',
        confirmButtonText: 'হ্যাঁ, খালি করুন',
        cancelButtonText: 'বাতিল'
      }).then((result) => {
        if (result.isConfirmed) {
          cart = [];
          localStorage.removeItem(CART_STORAGE_KEY);
          renderCart();
        }
      });
    }

    function proceedToCheckout() {
      if (cart.length === 0) return;
      window.location.href = `checkout.html?fromCart=true&shop=${encodeURIComponent(currentShop)}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      loadCart();
    });
  </script>
</body>
</html>
